[package]
name = "note4"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "note4"
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-hal.workspace = true
esp-bootloader-esp-idf.workspace = true
esp-alloc.workspace = true
esp-backtrace = { workspace = true, features = ["panic-handler", "custom-halt"] }
esp-println.workspace = true
critical-section.workspace = true
log.workspace = true
embedded-graphics.workspace = true
static_cell.workspace = true
heapless.workspace = true
ssd2683.workspace = true
embedded-hal.workspace = true
zectrix-screen.workspace = true
zectrix-board = { workspace = true, features = ["hal"] }
# Networking for server screens (used only when build.rs sets cfg(screen_server)).
zectrix-net = { workspace = true, features = ["hal"] }
esp-rtos.workspace = true
esp-radio.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-net.workspace = true
mbedtls-rs.workspace = true
tinyrlibc.workspace = true

[build-dependencies]
zectrix-net = { workspace = true, features = ["build"] }
