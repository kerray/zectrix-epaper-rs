[package]
name = "note4c"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "note4c"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# exception-handler turns CPU exceptions into panics, which src/crash.rs records.
esp-hal = { workspace = true, features = ["exception-handler"] }
esp-bootloader-esp-idf.workspace = true
esp-alloc.workspace = true
esp-println.workspace = true
critical-section.workspace = true
log.workspace = true
embedded-graphics.workspace = true
static_cell.workspace = true
heapless.workspace = true
ssd2683.workspace = true
zectrix-board = { workspace = true, features = ["hal"] }
zectrix-net = { workspace = true, features = ["hal"] }
esp-rtos.workspace = true
esp-radio.workspace = true
embassy-executor.workspace = true
embassy-time.workspace = true
mbedtls-rs.workspace = true
tinyrlibc.workspace = true

[build-dependencies]
zectrix-net.workspace = true
heapless.workspace = true
